<body>
<header><div class="wrap bar"><div class="brand"><span aria-hidden="true">🏝️</span> 挫折成長探索島</div><div class="header-tools"><button class="pill" id="guide-open">📜 探索指南</button><button class="pill" id="reset-open">↻ 重置進度</button></div></div></header>
<main class="wrap">
<section class="map" aria-labelledby="title">
<div class="wood map-title"><h1 id="title">挫折成長探索島</h1><p>康軒五上國語第九課・在挫折中成長</p></div>
<div class="wood map-progress" aria-label="探索進度"><div id="progressText"></div><div class="stars" id="stars" aria-hidden="true"></div></div>
<div class="markers" id="links" role="navigation" aria-label="島上關卡"></div>
<div class="wood map-tip" id="map-tip">點選發光關卡，開始探索！</div>
</section>
<div class="map-footer"><div id="next-status"></div><div class="legend"><span>✨ 可挑戰</span><span>🔒 未解鎖</span><span>✅ 已完成</span></div></div>
<div class="map-alert" id="map-alert" role="status"></div>
<div class="foot">進度與寫作草稿保存在目前的瀏覽器。</div>
</main>
<dialog id="station-dialog" aria-labelledby="dialog-label"><div class="dialog-bar"><span id="dialog-label"></span><button id="back-map">返回地圖</button></div><section class="panel" id="panel" aria-label="目前任務"></section></dialog>
<dialog id="guide-dialog" aria-labelledby="guide-label"><div class="dialog-bar"><span id="guide-label">探索指南</span><form method="dialog"><button>關閉</button></form></div><div class="guide-content"><ol><li>點選島上發光的地標進入關卡。</li><li>完成任務得到一顆星，並解鎖下一關。</li><li>回地圖可重訪已完成的關卡，集滿六顆星就完成探索。</li></ol></div></dialog>
<dialog id="reset-dialog" aria-labelledby="reset-label"><div class="dialog-bar"><span id="reset-label">重置進度</span></div><div class="guide-content"><p>確定重新開始？這會清除這個瀏覽器中的關卡星星和成長筆記草稿。</p><form method="dialog" class="toolbar"><button value="cancel" class="action secondary">取消</button><button value="reset" class="action">確認重置</button></form></div></dialog>
<script>
const stations = ['課文地圖','拳擊故事','植物生存','字詞補給','成長筆記','登頂挑戰'];
let saved = {};
try { saved = JSON.parse(localStorage.getItem('growth-island-v1')) || {}; } catch {}
const state = {done:[], writing:['','','',''], ...saved};

let active = 0;
let order = [];

const adaptations = ['秋冬落葉，減少消耗','厚外皮保護果實，漂流時不易腐爛','肥厚的莖儲水，針狀葉減少水分蒸發'];
const words = [
 ['維／唯','維持、維護；唯一、唯獨'],
 ['嶇／驅／軀／區','崎嶇、驅趕、身軀、區別'],['拳／券／眷','拳擊、獎券、眷顧'],['銅／桐','銅牌、油桐'],['減／喊／緘','減少、喊叫、緘默'],['幼／幻','幼芽、幻想'],['即／既','即使、立即；既然、既定'],['鍛／緞','鍛造、鍛鍊；綢緞、緞帶'],['鍊／練','鐵鍊、鍛鍊；訓練、練習'],['給／予／衝','給予 ㄐㄧˇ ㄩˇ（授與）；給你 ㄍㄟˇ；予取予求 ㄩˊ；衝擊 ㄔㄨㄥ；衝著他 ㄔㄨㄥˋ']
];
const idioms = [
 ['東山再起','失敗後重新振作，再次有所表現。'],
 ['進退維谷','進也難、退也難，處境十分為難。'],
 ['戰戰兢兢','非常小心謹慎，生怕出錯。'],
 ['赤手空拳','手裡空無一物，也可形容毫無憑藉。'],
 ['對症下藥','找出問題的原因，用合適的方法處理。'],
 ['扶老攜幼','扶著老人、牽著小孩，形容老少一同出動。'],
 ['一觸即發','稍有觸動就會爆發，形容情勢緊張。'],
 ['化危機為轉機','把困難變成改善或重新出發的機會。']
];
const questions = [
 ['開頭連續提出三個問句，主要有什麼作用？',['引導讀者思考面對挫折的態度','交代奧運比賽的時間地點','說明三種植物的構造'],0,'作者用設問讓讀者先想想自己的選擇，再提出論點。'],
 ['哪一句最接近作者的論點？',['植物都能在海水中生存','遇到挫折時，可以調整方法，從考驗中成長','參加三次比賽就一定會得獎'],1,'文章強調面對挫折、找出不足並尋求方法。'],
 ['陳念琴在東京奧運八強落敗後，課文強調她得到什麼？',['巴黎奧運銅牌','不必再訓練的理由','原本的自信'],2,'課文把「找回自信」和後來在巴黎獲得銅牌分開敘述。'],
 ['哪項屬於課文用來支持論點的植物例子？',['秋冬落葉會讓樹耗掉更多養分','仙人掌靠肥厚的莖儲水','椰子靠薄外皮在海裡漂流'],1,'仙人掌的肥厚莖能儲水，針狀葉能減少水分散失。'],
 ['拳擊選手與植物的例子有什麼共同點？',['面對不同的困難，都有適應或應對的方式','只要繼續等待，困難都會消失','兩個例子都在說明如何得獎'],0,'作者用人與植物的例子，幫讀者理解面對考驗時調適的重要。'],
 ['「___使剛開始不順利，我也會繼續___習。」應填哪一組？',['既、練','即、鍊','即、練'],2,'「即使」表示就算；反覆學習用「練習」。'],
 ['「給予」的正確讀音是哪一個？',['ㄍㄟˇ ㄩˊ','ㄐㄧˇ ㄩˇ','ㄍㄟˇ ㄩˇ'],1,'「給予」讀作 ㄐㄧˇ ㄩˇ；「給你」的「給」才讀 ㄍㄟˇ。'],
 ['小明發現自己常抄錯數字，於是每次都對照題目檢查。哪個成語最合適？',['扶老攜幼','進退維谷','對症下藥'],2,'他先找出錯誤的原因，再採取能改善問題的方法。'],
 ['結尾用鐵塊受敲打而迸出火花的比喻，想說明什麼？',['挫折可以成為磨練，促使我們調整並成長','只要被批評，做法自然會改善','遇到失敗時應該維持原來的做法'],0,'鐵塊受敲打象徵接受考驗，火花象徵經過磨練所展現的成長。'],
 ['哪一項最適合當作「改變方法能幫助我們進步」的論據？',['我認為每個人都應該進步','一直用原本的方法就好','陶笛換指總慢半拍，我把兩個小節拆開慢練，後來能跟上節拍'],2,'這個例子清楚交代遇到的困難、調整方法和結果。']
];
let quiz = {index:0, answers:[]};
function persist(){try { localStorage.setItem('growth-island-v1',JSON.stringify(state)); } catch {}}
const stationDialog = document.querySelector('#station-dialog');
const guideDialog = document.querySelector('#guide-dialog');
const resetDialog = document.querySelector('#reset-dialog');
const mapAlert = document.querySelector('#map-alert');
const markers = [
 ['📖',18,36],['🥊',50,34],['🌵',81,36],
 ['🔤',19,68],['✍️',50,66],['🏆',81,67]
];
function nextStation(){return stations.findIndex((_,i)=>!state.done.includes(i));}
function syncNav(){
 const next=nextStation();
 document.querySelector('#progressText').textContent='探索進度 '+state.done.length+'／6';
 document.querySelector('#stars').innerHTML=stations.map((_,i)=>'<span class="'+(state.done.includes(i)?'':'off')+'">'+(state.done.includes(i)?'★':'☆')+'</span>').join('');
 document.querySelector('#next-status').textContent=next<0?'🏆 已集滿六顆星！':'🔓 第 '+(next+1)+' 關已開啟 · '+stations[next];
 document.querySelector('#map-tip').textContent=next<0?'六顆星全數集齊！':'點選發光關卡，開始探索！';
 document.querySelector('#links').innerHTML=stations.map((name,i)=>{
  const done=state.done.includes(i);
  const locked=!done&&i!==next;
  const [icon,x,y]=markers[i];
  return '<button type="button" class="marker '+(done?'done':locked?'locked':'available')+'" data-station="'+i+'" style="--x:'+x+'%;--y:'+y+'%" aria-label="第 '+(i+1)+' 關 '+name+'，'+(done?'已完成':locked?'未解鎖':'可挑戰')+'"><span class="marker-icon" aria-hidden="true">'+icon+'<span class="marker-state">'+(done?'★':locked?'🔒':'點我')+'</span></span><span class="marker-label"><span class="marker-number">'+(i+1)+'</span>'+name+'</span></button>';
 }).join('');
}
document.querySelector('#links').onclick=event=>{
 const button=event.target.closest('[data-station]');
 if(!button)return;
 const index=Number(button.dataset.station);
 if(!state.done.includes(index)&&index!==nextStation()){
  mapAlert.textContent='🔒 先完成「'+stations[nextStation()]+'」，再逐關解鎖。';
  return;
 }
 mapAlert.textContent='';
 openStation(index,true);
};
function finishStation(){
 if(!state.done.includes(active)){state.done.push(active);persist();}
 syncNav();
 if(!panel.querySelector('#advance')){
  const button=document.createElement('button');
  button.id='advance';
  button.className='action advance';
  button.textContent=nextStation()<0?'回地圖查看星星':'回地圖領取星星';
  button.onclick=()=>stationDialog.close();
  panel.append(button);
 }
}
function feedback(message){panel.querySelector('.feedback').textContent = message;}
function action(label,id,secondary=false){return '<button class="action '+(secondary?'secondary':'')+'" id="'+id+'">'+label+'</button>';}
function help(items){return items.map(([title,body])=>'<details><summary>'+title+'</summary><p>'+body+'</p></details>').join('');}
function openStation(index, move=false){
 active=index;
 document.querySelector('#dialog-label').textContent='第 '+(index+1)+' 關 · '+stations[index];
 const pages=[mapPage,storyPage,plantPage,wordPage,writingPage,quizPage];
 pages[index]();
 if(!stationDialog.open)stationDialog.showModal();
 if(move){stationDialog.scrollTop=0;panel.querySelector('h2').focus({preventScroll:true});}
}
function title(description){return '<h2 tabindex="-1">'+stations[active]+'</h2><p class="intro">'+description+'</p>';}
function mapPage(){
 panel.innerHTML=title('這是一篇議論文。作者先說自己的主張，再用例子說服讀者。')+
 '<div class="flow"><div><strong>第 1 段｜提出論點</strong>勇敢面對挫折，接受考驗，能磨練意志。</div><div><strong>第 2、3 段｜舉出論據</strong>陳念琴調適心情、堅持訓練。植物也能以不同方式適應環境。</div><div><strong>第 4 段｜重申論點</strong>正向面對挫折，發現不足，尋求解決方法。</div></div>'+
 help([['開頭為什麼連問三個問題？','這是設問。作者先讓讀者想想，自己會如何面對困難、逆境與失敗，再引出主張。'],['結尾為什麼提到鐵塊和火花？','課文以鐵塊受敲打後迸出火花作比喻，呼應首段的主張：考驗可以磨練意志。']])+
 '<div class="note">和同學說一說：遇到一件不順利的事時，什麼做法可能讓情況變好？</div>'+
 action('完成課文地圖','next');
 panel.querySelector('#next').onclick=()=>{finishStation();stationDialog.close();};
}
function storyPage(){
 panel.innerHTML=title('照事情發生的先後點選卡片，排出陳念琴的奧運歷程。')+
 '<ol class="order-list" aria-label="你的排列順序">'+order.map(i=>'<li>'+events[i]+'</li>').join('')+'</ol><div class="choices">'+
 [4,2,0,3,1].filter(i=>!order.includes(i)).map(i=>'<button class="choice" data-event="'+i+'">'+events[i]+'</button>').join('')+
 '</div><div class="feedback" role="status"></div><div class="toolbar">'+action('檢查順序','check')+action('取消上一步','undo',true)+'</div>';
 panel.querySelectorAll('[data-event]').forEach(button=>button.onclick=()=>{
  order.push(Number(button.dataset.event));storyPage();
  (panel.querySelector('[data-event]')||panel.querySelector('#check')).focus();
 });
 panel.querySelector('#undo').onclick=()=>{order.pop();storyPage();panel.querySelector('#undo').focus();};
 panel.querySelector('#check').onclick=()=>{
  if(order.length<events.length){feedback('還有卡片沒選完。');return;}
  if(order.every((event,i)=>event===i)){finishStation();feedback('順序正確！從調適心情到堅持訓練，她逐步找回自信。');}
  else {const i=order.findIndex((event,index)=>event!==index);feedback('第 '+(i+1)+' 張起需要調整。想一想里約、東京和巴黎三場奧運的先後。');}
 };
}
function plantPage(){
 panel.innerHTML=title('替三種植物選出課文提到的生存方式。')+
 plants.map((name,i)=>'<label class="form-row"><strong>'+name+'</strong><select data-plant="'+i+'"><option value="">選擇生存方式</option>'+adaptations.map((item,j)=>'<option value="'+j+'">'+item+'</option>').join('')+'</select></label>').join('')+
 '<div class="feedback" role="status"></div>'+action('檢查配對','check')+
 '<div class="note"><strong>想一想</strong><p>這些植物分別遇到高溫缺水、低溫及海水漂流。把「遇到的環境」和「應對方式」一起說出來。</p></div>';
 panel.querySelector('#check').onclick=()=>{
  const values=[...panel.querySelectorAll('select')].map(select=>select.value);
  if(values.includes('')){feedback('請先完成三組配對。');return;}
  const wrong=plants.filter((_,i)=>values[i]!==['2','0','1'][i]);
  if(wrong.length){feedback('再想想這些植物遇到的環境：'+wrong.join('、')+'。');return;}
  finishStation();feedback('三組都正確！這些植物的構造或季節變化，幫助它們適應環境。');
 };
}
function wordPage(){
 panel.innerHTML=title('點開形近字、多音字和成語，看看它們可以怎麼用。')+
 '<h3>字音字形</h3>'+help(words)+'<h3 style="margin-top:18px">成語與詞語</h3>'+help(idioms)+
 '<div class="note">試著造一句話：我發現問題出在＿＿，於是對症下藥，改用＿＿的方法。</div>'+action('完成字詞複習','complete');
 panel.querySelector('#complete').onclick=()=>{finishStation();panel.querySelector('#complete').textContent='字詞複習已完成';};
}
function writingPage(){
 const prompts=[['我的論點','我認為遇到挫折時，可以……'],['遇到的挫折','有一次，我在……時遇到……'],['我採取的方法','我發現……於是改用……'],['結果與收穫','後來……這件事讓我明白……']];
 panel.innerHTML=title('用自己的經驗支持論點。可以寫學陶笛、做數學題或練習扯鈴的經驗。')+
 prompts.map(([label,placeholder],i)=>'<label class="field"><span class="tag">'+(i===0?'論點':i===3?'結果與感想':'論據')+'</span>'+label+'<textarea data-field="'+i+'" placeholder="'+placeholder+'"></textarea></label>').join('')+
 help([['看一個示範','我認為練習遇到瓶頸時，可以把困難拆小。有一次吹陶笛，我換指總是慢半拍。我把容易卡住的兩小節圈起來，先慢慢吹，再跟著節拍器加快。後來我能跟上全班的速度，也明白找出卡住的地方，會比盲目重吹整首更有效。']])+
 '<div class="feedback" role="status"></div>'+action('完成成長筆記','check');
 panel.querySelectorAll('textarea').forEach(field=>{
  const index=Number(field.dataset.field);
  field.value=state.writing[index]??'';
  field.oninput=()=>{state.writing[index]=field.value;persist();};
 });
 panel.querySelector('#check').onclick=()=>{
  const empty=[...panel.querySelectorAll('textarea')].find(field=>!field.value.trim());
  if(empty){feedback('請填完四欄，再把它們連起來讀一遍。');empty.focus();return;}
  finishStation();feedback('筆記已完成！和同學分享，請他找出你的論點和支持論點的例子。');
 };
}
function quizPage(){
 const i=quiz.index;
 if(i===questions.length){
  const score=quiz.answers.filter((answer,index)=>answer===questions[index][2]).length;
  panel.innerHTML=title('你已完成登頂挑戰。')+'<div class="note"><strong>答對 '+score+'／'+questions.length+' 題</strong></div>'+help(questions.map(([q,options,correct,explanation],index)=>[(quiz.answers[index]===correct?'答對｜':'再複習｜')+q,'正確答案：'+options[correct]+'。'+explanation]))+action('再挑戰一次','retry');
  finishStation();
  panel.querySelector('#retry').onclick=()=>{quiz={index:0,answers:[]};openStation(5,true);};
  return;
 }
 const [question,options,correct,explanation]=questions[i];
 const selected=quiz.answers[i];
 const answered=selected!==undefined;
 panel.innerHTML=title('作答後會顯示正確答案與解析。')+
 '<p class="small">第 '+(i+1)+' 題／共 '+questions.length+' 題</p><p class="question">'+question+'</p><div class="choices">'+
 options.map((option,j)=>'<button class="choice '+(answered&&j===correct?'correct':answered&&j===selected?'incorrect':'')+'" data-answer="'+j+'" '+(answered?'disabled':'')+'>'+option+'</button>').join('')+
 '</div><div class="feedback" role="status"></div>'+(answered?action(i===questions.length-1?'看結果':'下一題','next'):'');
 if(answered){
  feedback((selected===correct?'答對了！':'正確答案：'+options[correct]+'。')+explanation);
  panel.querySelector('#next').onclick=()=>{quiz.index++;openStation(5,true);};
 }
 panel.querySelectorAll('[data-answer]').forEach(button=>button.onclick=()=>{
  quiz.answers[i]=Number(button.dataset.answer);quizPage();panel.querySelector('#next').focus();
 });
}
document.querySelector('#back-map').onclick=()=>stationDialog.close();
stationDialog.onclose=()=>document.querySelector('[data-station="'+(nextStation()<0?active:nextStation())+'"]')?.focus();
document.querySelector('#guide-open').onclick=()=>guideDialog.showModal();
document.querySelector('#reset-open').onclick=()=>{resetDialog.returnValue='';resetDialog.showModal();};
resetDialog.onclose=()=>{
 if(resetDialog.returnValue!=='reset')return;
 state.done=[];
 state.writing=['','','',''];
 order=[];
 quiz={index:0,answers:[]};
 persist();
 syncNav();
 mapAlert.textContent='進度已重置，可以從第一關重新探索。';
};
syncNav();
</script>
</body>
</html>
